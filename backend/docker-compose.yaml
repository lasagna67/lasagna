name: lasagna

# Переменные окружения: cp ../.env.example ../.env.docker
x-backend-build: &backend-build
  context: .
  dockerfile: dockerfile

services:
  postgres:
    image: postgres:18-alpine
    env_file: ../.env.docker
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # -h localhost: временный сервер initdb слушает только сокет, так что TCP-проверка не даст ложного ready
      test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrator:
    build:
      <<: *backend-build
      target: migrator
    env_file: ../.env.docker
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      <<: *backend-build
      target: server
    env_file: ../.env.docker
    ports:
      - "8080:8080"
    healthcheck:
      # 127.0.0.1, а не localhost: сервер слушает только IPv4, а localhost может резолвиться в ::1
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
