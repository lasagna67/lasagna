  /credit-products:
    get:
      description: 'Возвращает активные продукты, для которых не выявлено нарушений
        формальных условий. Все query-параметры необязательны: при неполных данных
        eligibility=needs_details, при полной проверке — eligible. Неподходящие продукты
        исключаются. Без параметров возвращается активный каталог с причинами недостающих
        данных; при отсутствии вариантов — []. Это предварительная проверка, а не
        кредитное решение.'
      parameters:
