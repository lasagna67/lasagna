info:
  contact: {}
  description: Кредитный кабинет предпринимателя.
  title: Lasagna API
  version: "0.1"
paths:
  /applications:
    post:
      consumes:
      - application/json
      description: |-
        Черновик от имени компании, в которой пользователь — представитель.
        Повтор с тем же Idempotency-Key и телом возвращает ту же заявку,
        с другим телом — 409 IDEMPOTENCY_CONFLICT.
      parameters:
      - description: Ключ повтора, до 255 символов
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Компания-заёмщик
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/intakedto.CreateApplicationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/applicationdto.ApplicationResponse'
        "400":
          description: INVALID_REQUEST
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "403":
          description: не клиент
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "404":
          description: 'NOT_FOUND: нет компании или пользователь не её участник'
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
        "409":
          description: IDEMPOTENCY_CONFLICT
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
        "422":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Новая заявка
      tags:
      - applications
  /applications/{id}:
    patch:
      consumes:
      - application/json
      description: |-
        В draft — любые поля запроса и залог, в info_requested — только из editable_fields,
        иначе 409 INVALID_STATE; поле вне editable_fields — 422 NOT_EDITABLE.
        Непереданное поле не меняется, null очищает значение. need_period и collateral
        заменяются целиком; collateral — только при collateral_mode = pledged.
        Полноту и условия продукта проверяет submit.
      parameters:
      - description: Заявка
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Изменения
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/intakedto.PatchApplicationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/applicationdto.ApplicationResponse'
        "400":
          description: 'INVALID_REQUEST: тело, неизвестное поле, нет изменений'
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
        "403":
          description: не клиент
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
        "409":
          description: REVISION_CONFLICT, INVALID_STATE
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
        "422":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Изменить заявку
      tags:
      - applications
  /applications/{id}/contract:
    get:
      description: Метаданные; файл — GET /documents/{id}/content с id договора.
      parameters:
      - description: Заявка
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: null — договора нет
          schema:
            $ref: '#/definitions/offerdto.ContractResponse'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Договор к предложению
      tags:
      - applications
  /applications/{id}/info-requests:
    get:
      parameters:
      - description: Заявка
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/underwritingdto.InfoRequestResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "404":
          description: 'NOT_FOUND: нет заявки или она чужая'
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Запросы банка
      tags:
      - applications
  /applications/{id}/info-requests/{rid}/answer:
    post:
      consumes:
      - application/json
      description: Поля из editable_fields правятся через PATCH заявки; после ответов
        на все запросы — resubmit.
      parameters:
      - description: Заявка
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Запрос
        format: uuid
        in: path
        name: rid
        required: true
        type: string
      - description: Ответ
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/underwritingdto.AnswerInfoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/applicationdto.ApplicationResponse'
        "400":
          description: INVALID_REQUEST
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
        "409":
          description: REVISION_CONFLICT, INVALID_STATE
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
        "422":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Ответить на запрос банка
      tags:
      - applications
  /applications/{id}/offer:
    get:
      parameters:
      - description: Заявка
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: null — предложения нет
          schema:
            $ref: '#/definitions/offerdto.OfferResponse'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Текущее предложение
      tags:
      - applications
  /applications/{id}/resubmit:
    post:
      consumes:
      - application/json
      description: |-
        info_requested → submitted после ответов на все запросы банка; запрос проверяется
        как при отправке. Повтор с тем же Idempotency-Key и телом не создаёт второй отправки.
      parameters:
      - description: Заявка
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Ключ повтора, до 255 символов
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Ожидаемая revision
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/intakedto.RevisionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/applicationdto.ApplicationResponse'
        "400":
          description: INVALID_REQUEST
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
        "403":
          description: не клиент
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
        "409":
          description: REVISION_CONFLICT, INVALID_STATE, IDEMPOTENCY_CONFLICT
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
        "422":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
        "503":
          description: 'SERVICE_UNAVAILABLE: конвейер'
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Отправить повторно
      tags:
      - applications
  /applications/{id}/submit:
    post:
      consumes:
      - application/json
      description: |-
        draft → submitted → конвейер проверок. Неполный запрос или нарушение условий
        продукта — 422 с полями, заявка остаётся draft. Повтор с тем же Idempotency-Key
        и телом не создаёт второй отправки.
      parameters:
      - description: Заявка
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Ключ повтора, до 255 символов
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Ожидаемая revision
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/intakedto.RevisionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/applicationdto.ApplicationResponse'
        "400":
          description: INVALID_REQUEST
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
        "403":
          description: не клиент
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
        "409":
          description: REVISION_CONFLICT, INVALID_STATE, IDEMPOTENCY_CONFLICT
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
        "422":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
        "503":
          description: 'SERVICE_UNAVAILABLE: конвейер'
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Отправить заявку
      tags:
      - applications
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Email и пароль
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "401":
          description: неверный email или пароль
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "403":
          description: пользователь заблокирован
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "500":
