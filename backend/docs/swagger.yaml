            $ref: '#/definitions/applicationdto.ErrorResponse'
        "409":
          description: REVISION_CONFLICT, INVALID_STATE
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
        "422":
          description: 'VALIDATION_FAILED: условия, проверки, залог'
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
        "503":
          description: 'SERVICE_UNAVAILABLE: хранилище договоров'
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Опубликовать решение
      tags:
      - underwriter
  /underwriter/applications/{id}/request-info:
    post:
      consumes:
      - application/json
      description: |-
        Создаёт запрос клиенту и переводит заявку в info_requested.
        editable_fields — поля черновика, которые клиент сможет поправить.
      parameters:
      - description: Заявка
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Запрос
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/underwritingdto.RequestInfoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/underwritingdto.ReviewApplicationResponse'
        "400":
          description: INVALID_REQUEST
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
        "403":
          description: 'FORBIDDEN: заявка у другого сотрудника'
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
        "409":
          description: REVISION_CONFLICT, INVALID_STATE
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
        "422":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Запросить уточнения
      tags:
      - underwriter
  /underwriter/applications/{id}/retry-checks:
    post:
      consumes:
      - application/json
      description: |-
        Перезапрашивает источники; результат придёт асинхронно с новой revision.
        Пока конвейер не подключён — 503.
      parameters:
      - description: Заявка
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Источники
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/underwritingdto.RetryChecksRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/underwritingdto.ReviewApplicationResponse'
        "400":
          description: INVALID_REQUEST
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
        "403":
          description: 'FORBIDDEN: заявка у другого сотрудника'
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
        "409":
          description: REVISION_CONFLICT, INVALID_STATE
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
        "422":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
        "503":
          description: SERVICE_UNAVAILABLE
          schema:
            $ref: '#/definitions/applicationdto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Повторить проверки
      tags:
      - underwriter
  /underwriter/applications/{id}/take:
    post:
      consumes:
      - application/json
      description: |-
        Назначает заявку на текущего сотрудника. Повтор тем же сотрудником безопасен;
        заявку другого сотрудника — 409 INVALID_STATE.
      parameters:
      - description: Заявка
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Версия заявки
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/underwritingdto.RevisionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
