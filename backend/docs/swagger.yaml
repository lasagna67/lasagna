basePath: /api/v0
definitions:
  collateraldomain.Collateral:
    properties:
      declared_value_kopecks:
        minimum: 1
        type: integer
      description:
        type: string
      ownership:
        enum:
        - existing
        - acquired
        type: string
      revision:
        type: integer
      type:
        enum:
        - real_estate
        - equipment
        - vehicle
        type: string
    required:
    - declared_value_kopecks
    - description
    - ownership
    - type
    type: object
  collateraldomain.CollateralApplication:
    properties:
      collateral:
        $ref: '#/definitions/collateraldomain.Collateral'
      collateral_coverage_satisfied:
        type: boolean
      collateral_required:
        type: boolean
      collateral_review:
        $ref: '#/definitions/collateraldomain.CollateralReview'
      collateral_review_current:
        type: boolean
      company_id:
        type: string
      has_collateral:
        type: boolean
      id:
        type: string
      product_code:
        type: string
      requested_amount_kopecks:
        type: integer
      revision:
        type: integer
      status:
        $ref: '#/definitions/creditdomain.Status'
    type: object
  collateraldomain.CollateralReview:
    properties:
      accepted_value_kopecks:
        type: integer
      application_id:
        type: string
      collateral_hash:
        type: string
      collateral_revision:
        type: integer
      created_at:
        type: string
      id:
        type: string
      public_comment:
        type: string
      result:
        type: string
      reviewer:
        type: string
      revision:
        type: integer
      version:
        type: integer
    type: object
  collateraldomain.PatchApplication:
    properties:
      collateral:
        $ref: '#/definitions/collateraldomain.Collateral'
      expected_revision:
        minimum: 1
        type: integer
      has_collateral:
        type: boolean
      requested_amount_kopecks:
        type: integer
    required:
    - expected_revision
    type: object
  collateraldomain.ReviewCollateral:
    properties:
      accepted_value_kopecks:
        minimum: 1
        type: integer
      comment:
        type: string
      expected_revision:
        minimum: 1
        type: integer
      public_comment:
        type: string
      result:
        enum:
        - accepted
        - needs_info
        - rejected
        type: string
    required:
    - comment
    - expected_revision
    - result
    type: object
  companydomain.CreditHistory:
    properties:
      has_credit_history:
        description: nil означает, что обязательное поле отсутствовало или было null.
        type: boolean
      history_months:
        type: integer
      loans:
        items:
          $ref: '#/definitions/companydomain.Loan'
        type: array
    type: object
  companydomain.CreditReport:
    properties:
      business_id:
        type: string
      inn:
        type: string
      report:
        $ref: '#/definitions/companydomain.CreditHistory'
      report_date:
        type: string
      status:
        type: string
    type: object
  companydomain.FinancialReport:
    properties:
      business_id:
        type: string
      currency:
        type: string
      error_code:
        type: string
      inn:
        type: string
      message:
        type: string
      monthly_data:
        items:
          $ref: '#/definitions/companydomain.MonthlyData'
        type: array
      period:
        $ref: '#/definitions/companydomain.Period'
      status:
        type: string
    type: object
  companydomain.Loan:
    properties:
      amount:
        format: int64
        type: integer
      closed_date:
        type: string
      currency:
        type: string
      last_payment_date:
        type: string
      loan_id:
        type: string
      loan_type:
        type: string
      monthly_payment:
        format: int64
        type: integer
      opened_date:
        type: string
      outstanding_amount:
        format: int64
        type: integer
      overdue_amount:
        format: int64
        type: integer
      overdue_days:
        type: integer
      overdue_since:
        type: string
      status:
        type: string
    type: object
  companydomain.MonthlyData:
    properties:
      expenses:
        format: int64
        type: integer
      free_cash:
        format: int64
        type: integer
      income:
        format: int64
        type: integer
      month:
        type: string
      owner_withdrawals:
        format: int64
        type: integer
      taxes:
        format: int64
        type: integer
    type: object
  companydomain.Period:
    properties:
      from:
        type: string
      to:
        type: string
    type: object
  companydto.ActivityResponse:
    properties:
      code:
        example: "25.62"
        type: string
      name:
        example: Обработка металлических изделий механическая
        type: string
    type: object
  companydto.AddMemberRequest:
    properties:
      email:
        example: buh@kedr-demo.ru
        type: string
      position:
        enum:
        - cfo
        - accountant
        - finance_officer
        - authorized_employee
        example: accountant
        type: string
    type: object
  companydto.ChallengeRequest:
    properties:
      inn:
        example: "7705005410"
        type: string
    type: object
  companydto.ChallengeResponse:
    properties:
      challenge_id:
        example: 3f1c2a9e-5b7d-4c11-9a8e-2d6f0b4e7c13
        type: string
      company:
        $ref: '#/definitions/companydto.RegistryCardResponse'
      data:
        example: Заявление о подключении компании к кредитному кабинету...
        type: string
      expires_at:
        type: string
    type: object
  companydto.CompanyResponse:
    properties:
      additional_okveds:
        example:
        - "25.61"
        - "46.72"
        items:
          type: string
        type: array
      business_status:
        enum:
        - active
        - reorganizing
        - terminated
        example: active
        type: string
      entity_type:
        enum:
        - legal_entity
        - individual_entrepreneur
        example: legal_entity
        type: string
      head:
        $ref: '#/definitions/companydto.HeadResponse'
      id:
        example: 9b2f6c1e-4a3d-4f7b-8c2e-1d5a6b7c8d9e
        format: uuid
        type: string
      inn:
        example: "7705005410"
        type: string
      membership:
        $ref: '#/definitions/companydto.MembershipResponse'
      name:
        example: ООО «Кедровый контур Демо»
        type: string
      primary_okved:
        example: "25.62"
        type: string
      registration_date:
        example: "2012-04-17"
        format: date
        type: string
      registry_synced_at:
        type: string
      termination_date:
        format: date
        type: string
    type: object
  companydto.ConnectRequest:
    properties:
      challenge_id:
        example: 3f1c2a9e-5b7d-4c11-9a8e-2d6f0b4e7c13
        type: string
      signature:
        example: eyJzZXJpYWwiOiIwQkZEMDE4NDAzN0Y0ODY3IiwuLi59
        type: string
    type: object
  companydto.CreditHistorySource:
    properties:
      data:
        $ref: '#/definitions/companydomain.CreditReport'
      status:
        enum:
        - ok
        - not_found
        - unavailable
        type: string
    type: object
  companydto.FinancialsSource:
    properties:
      data:
        $ref: '#/definitions/companydomain.FinancialReport'
      status:
        enum:
        - ok
        - not_found
        - unavailable
        type: string
    type: object
  companydto.HeadResponse:
    properties:
      full_name:
        example: Кедрова Анна Викторовна
        type: string
      position:
        example: Генеральный директор
        type: string
    type: object
  companydto.MemberResponse:
    properties:
      can_sign:
        example: false
        type: boolean
      confirmed_by:
        enum:
        - esign
        - invite
        example: invite
        type: string
      created_at:
        type: string
      email:
        example: buh@kedr-demo.ru
        type: string
      first_name:
        example: Мария
        type: string
      last_name:
        example: Счётова
        type: string
      middle_name:
        example: Ильинична
        type: string
      position:
        enum:
        - owner
        - ceo
        - cfo
        - accountant
        - finance_officer
        - authorized_employee
        example: accountant
        type: string
      user_id:
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        format: uuid
        type: string
    type: object
  companydto.MembershipResponse:
    properties:
      can_sign:
        example: true
        type: boolean
      position:
        enum:
        - owner
        - ceo
        - cfo
        - accountant
        - finance_officer
        - authorized_employee
        example: ceo
        type: string
    type: object
  companydto.OverviewResponse:
    properties:
      company_id:
        format: uuid
        type: string
      credit_history:
        $ref: '#/definitions/companydto.CreditHistorySource'
      financials:
        $ref: '#/definitions/companydto.FinancialsSource'
      registry:
        $ref: '#/definitions/companydto.RegistrySource'
    type: object
  companydto.RegistryCardResponse:
    properties:
      business_status:
        enum:
        - active
        - reorganizing
        - terminated
        example: active
        type: string
      entity_type:
        enum:
        - legal_entity
        - individual_entrepreneur
        example: legal_entity
        type: string
      head:
        $ref: '#/definitions/companydto.HeadResponse'
      inn:
        example: "7705005410"
        type: string
      name:
        example: ООО «Кедровый контур Демо»
        type: string
      okved:
        items:
          $ref: '#/definitions/companydto.ActivityResponse'
        type: array
      registration_date:
        example: "2012-04-17"
        format: date
        type: string
      termination_date:
        format: date
        type: string
    type: object
  companydto.RegistrySource:
    properties:
      data:
        $ref: '#/definitions/companydto.RegistryCardResponse'
      status:
        enum:
        - ok
        - not_found
        - unavailable
        type: string
    type: object
  creditdomain.Status:
    enum:
    - draft
    - submitted
    - validation
    - enrichment
    - scoring
    - manual_review
    - info_requested
    - approved
    - counter_offer
    - signing
    - issued
    - rejected
    - cancelled
    - expired
    type: string
    x-enum-comments:
      StatusApproved: предложение на запрошенных условиях
      StatusCancelled: клиент отказался от предложения
      StatusCounterOffer: предложение на иных условиях
      StatusDraft: клиент заполняет, данные сохраняются по шагам
      StatusEnrichment: реестр и БКИ для версии заявки
      StatusExpired: предложение не подписано до valid_until
      StatusInfoRequested: клиент отвечает в той же заявке
      StatusIssued: выдача или активация лимита завершена
      StatusManualReview: 'у сотрудника: материалы, залог, решение'
      StatusRejected: отказ сотрудника или stop-правила
      StatusScoring: вызов модели; без правил — ручной маршрут
      StatusSigning: договор подписан, ожидается выдача
      StatusSubmitted: версия зафиксирована, ждёт конвейера
      StatusValidation: проверка состава данных и условий продукта
    x-enum-descriptions:
    - клиент заполняет, данные сохраняются по шагам
    - версия зафиксирована, ждёт конвейера
    - проверка состава данных и условий продукта
    - реестр и БКИ для версии заявки
    - вызов модели; без правил — ручной маршрут
    - 'у сотрудника: материалы, залог, решение'
    - клиент отвечает в той же заявке
    - предложение на запрошенных условиях
    - предложение на иных условиях
    - договор подписан, ожидается выдача
    - выдача или активация лимита завершена
    - отказ сотрудника или stop-правила
    - клиент отказался от предложения
    - предложение не подписано до valid_until
    x-enum-varnames:
    - StatusDraft
    - StatusSubmitted
    - StatusValidation
    - StatusEnrichment
    - StatusScoring
    - StatusManualReview
    - StatusInfoRequested
    - StatusApproved
    - StatusCounterOffer
    - StatusSigning
    - StatusIssued
    - StatusRejected
    - StatusCancelled
    - StatusExpired
  dto.AuthResponse:
    properties:
      access_token:
        example: q3Jx0o9cV2m4tJ7yHq1kB8nZ5wA6sD0fG2hK4lP9rT0
        type: string
      expires_at:
        type: string
      token_type:
        example: Bearer
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.LoginRequest:
    properties:
      email:
        example: owner@kedr-demo.ru
        type: string
      password:
        example: Secret123
        type: string
    type: object
  dto.UserResponse:
    properties:
      id:
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        format: uuid
        type: string
      role:
        enum:
        - client
        - underwriter
        - admin
        example: client
        type: string
    type: object
  swagger.HTTPError:
    properties:
      message:
        example: Неверный email или пароль
        type: string
    type: object
  userdto.CreateClientRequest:
    properties:
      email:
        example: owner@kedr-demo.ru
        type: string
      first_name:
        example: Иван
        type: string
      last_name:
        example: Петров
        type: string
      middle_name:
        example: Сергеевич
        type: string
      password:
        example: Secret123
        type: string
      phone:
        example: "+79991234567"
        type: string
    type: object
  userdto.UserResponse:
    properties:
      created_at:
        type: string
      email:
        example: a.smirnova@lasagna-bank.ru
        type: string
      first_name:
        example: Анна
        type: string
      id:
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        format: uuid
        type: string
      last_name:
        example: Смирнова
        type: string
      middle_name:
        example: Олеговна
        type: string
      phone:
        example: "+79991234567"
        type: string
      role:
        enum:
        - client
        - underwriter
        - admin
        example: underwriter
        type: string
      status:
        enum:
        - active
        - banned
        - deleted
        example: active
        type: string
      updated_at:
        type: string
    type: object
info:
  contact: {}
  description: Кредитный кабинет предпринимателя.
  title: Lasagna API
  version: "0.1"
paths:
  /applications/{id}:
    patch:
      consumes:
      - application/json
      description: Доступно клиенту компании в draft, info_requested, manual_review.
        Обязателен expected_revision. collateral заменяется целиком; его revision
        задаёт сервер. Оценки, заключения и хеши банка клиент менять не может. Конфликт
        версии — 409. Внутренние комментарии банка в ответ не включаются.
      parameters:
      - description: ID заявки
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Изменения
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/collateraldomain.PatchApplication'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/collateraldomain.CollateralApplication'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/swagger.HTTPError'
      security:
      - BearerAuth: []
      summary: Изменить сумму и залог своей заявки
      tags:
      - applications
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Email и пароль
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "401":
          description: неверный email или пароль
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "403":
          description: пользователь заблокирован
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/swagger.HTTPError'
      summary: Вход
      tags:
      - auth
  /auth/logout:
    post:
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/swagger.HTTPError'
      security:
      - BearerAuth: []
      summary: Выход
      tags:
      - auth
  /auth/me:
    get:
      description: Возвращает id и роль владельца токена.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swagger.HTTPError'
      security:
      - BearerAuth: []
      summary: Текущий пользователь
      tags:
      - auth
  /companies:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/companydto.CompanyResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swagger.HTTPError'
      security:
      - BearerAuth: []
      summary: Мои компании
      tags:
      - companies
    post:
      consumes:
      - application/json
      description: |-
        Шаг 2 из 2. Проверяет подпись заявления и сверяет владельца сертификата
        с руководителем по ЕГРЮЛ или с ИНН ИП по ЕГРИП. Пользователь становится
        ceo (ЮЛ) или owner (ИП) с правом подписи. Заявление тратится при любом исходе.
      parameters:
      - description: Подписанное заявление
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/companydto.ConnectRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/companydto.CompanyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "403":
          description: сертификат не руководителя
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "410":
          description: заявление истекло или уже использовано
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "422":
          description: подпись не прошла проверку
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "503":
          description: реестр или УЦ недоступны
          schema:
            $ref: '#/definitions/swagger.HTTPError'
      security:
      - BearerAuth: []
      summary: Подключение компании
      tags:
      - companies
  /companies/{id}:
    get:
      parameters:
      - description: id компании
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/companydto.CompanyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "404":
          description: нет компании или пользователь не её участник
          schema:
            $ref: '#/definitions/swagger.HTTPError'
      security:
      - BearerAuth: []
      summary: Компания
      tags:
      - companies
  /companies/{id}/financials:
    post:
      consumes:
      - multipart/form-data
      description: 'Только для client, состоящего в компании. Передайте один CSV в
        поле file. Максимальный размер всего multipart-запроса — 2 МиБ. Заголовок:
        inn,month,income,expenses,taxes,owner_withdrawals. Все суммы — неотрицательные
        целые копейки, месяц — YYYY-MM. ИНН каждой строки должен совпадать с компанией,
        месяцы не должны повторяться. free_cash = income - expenses - taxes - owner_withdrawals.
        Файл проверяется полностью до записи. Загрузка заменяет сохранённый финансовый
        отчёт компании; реестр и БКИ сохраняются. Ответ содержит сохранённый отчёт,
        месяцы отсортированы. Повторная загрузка не создаёт отдельную строку overview.'
      parameters:
      - description: ID компании
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: CSV в UTF-8 с разделителем запятая; суммы в копейках
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/companydomain.FinancialReport'
        "400":
          description: Некорректный CSV, ИНН, ID компании или отсутствие файла
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "404":
          description: Компания не найдена или пользователь не участник
          schema:
            $ref: '#/definitions/swagger.HTTPError'
