basePath: /api/v0
definitions:
  applicationdomain.Status:
    enum:
    - draft
    - submitted
    - validation
    - enrichment
    - scoring
    - manual_review
    - info_requested
    - approved
    - counter_offer
    - signing
    - issued
    - rejected
    - cancelled
    - expired
    type: string
    x-enum-comments:
      StatusApproved: предложение на запрошенных условиях
      StatusCancelled: клиент отказался от предложения
      StatusCounterOffer: предложение на иных условиях
      StatusDraft: клиент заполняет, данные сохраняются по шагам
      StatusEnrichment: реестр и БКИ для версии заявки
      StatusExpired: предложение не подписано до valid_until
      StatusInfoRequested: клиент отвечает в той же заявке
      StatusIssued: выдача или активация лимита завершена
      StatusManualReview: 'у сотрудника: материалы, залог, решение'
      StatusRejected: отказ сотрудника или stop-правила
      StatusScoring: вызов модели; без правил — ручной маршрут
      StatusSigning: договор подписан, ожидается выдача
      StatusSubmitted: версия зафиксирована, ждёт конвейера
      StatusValidation: проверка состава данных и условий продукта
    x-enum-descriptions:
    - клиент заполняет, данные сохраняются по шагам
    - версия зафиксирована, ждёт конвейера
    - проверка состава данных и условий продукта
    - реестр и БКИ для версии заявки
    - вызов модели; без правил — ручной маршрут
    - 'у сотрудника: материалы, залог, решение'
    - клиент отвечает в той же заявке
    - предложение на запрошенных условиях
    - предложение на иных условиях
    - договор подписан, ожидается выдача
    - выдача или активация лимита завершена
    - отказ сотрудника или stop-правила
    - клиент отказался от предложения
    - предложение не подписано до valid_until
    x-enum-varnames:
    - StatusDraft
    - StatusSubmitted
    - StatusValidation
    - StatusEnrichment
    - StatusScoring
    - StatusManualReview
    - StatusInfoRequested
    - StatusApproved
    - StatusCounterOffer
    - StatusSigning
    - StatusIssued
    - StatusRejected
    - StatusCancelled
    - StatusExpired
