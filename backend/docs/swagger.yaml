        месяцев приоритет у мока. При наличии данных status=ok; без данных сохраняется
        not_found или unavailable и data=null. Если и в БД нет нужного месяца, отсутствующие
        данные не выдумываются: возвращается доступный отчёт. Отсутствие снимка не
        является ошибкой; ошибка чтения БД даёт 500. GET ничего не сохраняет. Денежные
        суммы передаются в целых копейках.'
