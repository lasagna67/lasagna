        type: integer
      - description: 'Дата регистрации бизнеса: YYYY-MM-DD; возраст рассчитывается
          по дате Europe/Moscow'
        format: date
        in: query
        name: registration_date
        type: string
      - description: required — с залогом, not_supported — без залога, optional —
          выбор ещё не сделан
        enum:
        - not_supported
        - optional
        - required
        in: query
        name: collateral_mode
        type: string
