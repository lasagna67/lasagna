basePath: /api/v0
definitions:
  dto.AuthResponse:
    properties:
      access_token:
        example: q3Jx0o9cV2m4tJ7yHq1kB8nZ5wA6sD0fG2hK4lP9rT0
        type: string
      expires_at:
        type: string
      token_type:
        example: Bearer
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.LoginRequest:
    properties:
      email:
        example: owner@kedr-demo.ru
        type: string
      password:
        example: Secret123
        type: string
    type: object
  dto.UserResponse:
    properties:
      id:
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        format: uuid
        type: string
      role:
        enum:
        - client
        - underwriter
        - admin
        example: client
        type: string
    type: object
  swagger.HTTPError:
    properties:
      message:
        example: Неверный email или пароль
        type: string
    type: object
  userdto.CreateClientRequest:
    properties:
      email:
        example: owner@kedr-demo.ru
        type: string
      first_name:
        example: Иван
        type: string
      last_name:
        example: Петров
        type: string
      middle_name:
        example: Сергеевич
        type: string
      password:
        example: Secret123
        type: string
      phone:
        example: "+79991234567"
        type: string
    type: object
  userdto.UserResponse:
    properties:
      created_at:
        type: string
      email:
        example: a.smirnova@lasagna-bank.ru
        type: string
      first_name:
        example: Анна
        type: string
      id:
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        format: uuid
        type: string
      last_name:
        example: Смирнова
        type: string
      middle_name:
        example: Олеговна
        type: string
      phone:
        example: "+79991234567"
        type: string
      role:
        enum:
        - client
        - underwriter
        - admin
        example: underwriter
        type: string
      status:
        enum:
        - active
        - banned
        - deleted
        example: active
        type: string
      updated_at:
        type: string
    type: object
info:
  contact: {}
  description: Кредитный кабинет предпринимателя.
  title: Lasagna API
  version: "0.1"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Email и пароль
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "401":
          description: неверный email или пароль
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "403":
          description: пользователь заблокирован
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/swagger.HTTPError'
      summary: Вход
      tags:
      - auth
  /auth/logout:
    post:
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/swagger.HTTPError'
      security:
      - BearerAuth: []
      summary: Выход
      tags:
      - auth
  /auth/me:
    get:
      description: Возвращает id и роль владельца токена.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swagger.HTTPError'
      security:
      - BearerAuth: []
      summary: Текущий пользователь
      tags:
      - auth
  /users:
    post:
      consumes:
      - application/json
      description: Заводит пользователя с ролью client и статусом active, сессию не
        открывает.
      parameters:
      - description: Данные клиента
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/userdto.CreateClientRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/userdto.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "409":
          description: email или телефон уже заняты
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/swagger.HTTPError'
      summary: Создание клиента
      tags:
      - users
  /users/{id}:
    delete:
      description: Ставит статус deleted, запись остаётся в БД. Только для admin.
      parameters:
      - description: id пользователя
        format: uuid
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/swagger.HTTPError'
      security:
      - BearerAuth: []
      summary: Удаление пользователя
      tags:
      - users
  /users/{id}/ban:
    post:
      description: Ставит статус banned. Только для admin.
      parameters:
      - description: id пользователя
        format: uuid
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/swagger.HTTPError'
      security:
      - BearerAuth: []
      summary: Бан пользователя
      tags:
      - users
  /users/{id}/reset:
    post:
      description: Возвращает статус active после бана или удаления. Только для admin.
      parameters:
      - description: id пользователя
        format: uuid
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/swagger.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/swagger.HTTPError'
      security:
      - BearerAuth: []
      summary: Восстановление пользователя
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Токен из /auth/login в формате "Bearer <access_token>".
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
